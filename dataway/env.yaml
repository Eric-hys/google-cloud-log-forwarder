# Placeholders only. The DataWay token is NOT set here: give it to Cloud Run from Secret Manager
# with --set-secrets DATAWAY_TOKEN=<secret name>:latest.
DATAWAY_URL: "https://DATAWAY_HOST"            # e.g. https://eu1-openway.truewatch.com
EXPECTED_PROJECT_ID: "PROJECT_ID"
EXPECTED_SUBSCRIPTION: "projects/PROJECT_ID/subscriptions/SUBSCRIPTION_ID"
MEASUREMENT: "gcp_alb"                         # log source in TrueWatch
# EXTRA_TAGS: "ENV=prod"                       # optional static tags, k=v pairs separated by commas
# DATAWAY_TOKEN_TYPE: "workspace"              # "client" for a Client Token (adds to_headless=true)
# DATAWAY_GZIP: "false"                        # "true" sends gzip bodies (verify on your DataWay first)
# BATCH_MAX_RECORDS: "500"
# BATCH_MAX_BYTES: "2097152"
# BATCH_MAX_WAIT_MS: "200"
# SENDERS: "4"
# QUEUE_MAX: "5000"
